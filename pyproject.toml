[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "findio"
version = "1.2.0"
description = "Find a machine or its BMC on a crowded LAN: baseline, diff, sticky MAC labels."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sean Webster" }]
keywords = ["network", "arp", "bmc", "ipmi", "lan", "discovery"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.50", "rich>=13"]
dev = ["pytest>=8", "textual>=0.50", "rich>=13"]

[project.scripts]
findio = "findio.cli:main"

[tool.setuptools.packages.find]
include = ["findio*"]

[tool.setuptools.package-data]
findio = ["data/oui.csv"]
